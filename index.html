<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>反省アンケート入力</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      line-height: 1.6;
    }

    /* タイトル下の説明文（項目名より大きめ） */
    #subtitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      white-space: pre-line; /* 改行をそのまま反映 */
    }

    /* 組番号は1/4の幅 */
    #groupNum {
      width: 25%;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      box-sizing: border-box;
      display: block; /* 横並び防止 */
    }

    /* テキストエリアは全幅 */
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      box-sizing: border-box;
    }

    /* 送信ボタンは1/5の幅 */
    #sendBtn {
      width: 20%;
      padding: 12px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h2>反省アンケート入力</h2>

  <!-- 追加した説明文 -->
  <div id="subtitle">
　クリーンキャンペーン・安否確認訓練の実施後の反省等のついて
以下の通り、気になる点、改善すべき点、良かった点等を記入
ください。お手数ですが、6/14までにアクセスし、ご入力下さい。
  </div>

  <label>組番号（半角数字）</label><br>
  <input type="text" id="groupNum" placeholder="例：1〜18">

  <label>① 安否確認について</label>
  <textarea id="anpi"></textarea>

  <label>② 避難訓練について</label>
  <textarea id="hinan"></textarea>

  <label>③ クリーンキャンペーンについて</label>
  <textarea id="clean"></textarea>

  <br>
  <button id="sendBtn">送信</button>

  <script>
    async function main() {
      await liff.init({ liffId: "2010107820-5EQJ0xX7" });
      // 開発用メッセージは削除済み
    }
    main();
  </script>
</body>
</html>
