<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ご記入のお願い</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      line-height: 1.6;
    }

    /* タイトル下の説明文（項目名より大きめ） */
    #subtitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    /* 組番号は1/4の幅 */
    #groupNum {
      width: 25%;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      box-sizing: border-box;
      display: block;
    }

    /* テキストエリアは全幅 */
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      box-sizing: border-box;
    }

    /* 送信ボタンは1/5の幅 */
    #sendBtn {
      width: 20%;
      padding: 12px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    /* 確認ボタン（小さめ） */
    .checkBtn {
      font-size: 12px;
      padding: 4px 8px;
      margin-left: 10px;
      cursor: pointer;
    }

    /* ダイアログ（モーダル） */
    #modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: flex-start;
      padding-top: 40
